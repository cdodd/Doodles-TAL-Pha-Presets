  { with = "Worn Piano", why = "A faded piano and flute make a very nostalgic pair." },
  { with = "Vinyl noise bed", external = true, why = "Reinforces the feeling of an old recording." },
]
tweaks = [
  { control = "Noise to 1.5", result = "Much breathier, as if blown harder." },
  { control = "LFO Rate up to about 1 Hz", result = "A faster, seasick wobble." },
  { control = "VCF Cutoff to 7.0", result = "A clearer, brighter tone, closer to a piccolo." },
]
[patch.params]
DcoRange = 1
DcoWaveSaw = 0
DcoWavePulse = 1
DcoSubLevel = 0
Noise = 0.45
NumberOfVoices = 0
VcfCutoff = 0.6
VcfKeyFollow = 0.8
VcaEnvMode = 2
EnvAttackTime = 0.22
EnvDecayTime = 0.5
EnvSustainLevel = 0.8
EnvReleaseTime = 0.35
DcoLfoMod = 0.06
LfoRate = 0.42
LfoWaveform = 1
ModWheelDcoLfo = 0.07
reverbDryWet = 0.3
reverbSize = 0.6
reverbTone = 0.25
[patch.why]
DcoWavePulse = "A square filtered low has the hollow, odd-harmonic tone of a flute."
Noise = "A small amount acts as breath, passing through the same filter as the tone."
DcoLfoMod = "A slow, shallow pitch drift that sounds like an old tape's wobble."
LfoRate = "About 0.5 Hz: slow enough to be felt as instability, not heard as vibrato."
LfoWaveform = "A sine moves smoothly, like tape speed drifting, with no corners."
EnvAttackTime = "A soft start, as a flute's sound has when breath builds."
VcaEnvMode = "Normal-Dynamic: velocity sets level, which gives the phrase breathing dynamics."
