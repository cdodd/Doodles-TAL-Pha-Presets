pairings = [
  { with = "Ghost Mall", why = "Same soft, slightly hazy world." },
  { with = "Warm Tines", why = "Soft electric-piano chords sit gently over it." },
  { with = "Dry, intimate vocal", external = true, why = "Stays out of the vocal's way." },
]
tweaks = [
  { control = "CHORUS off", result = "Focused, mono-safe and more solid; loses the velvet shimmer." },
  { control = "PWM RATE to 5.0", result = "Faster, more obvious movement: more 'analog string' than soft bass." },
  { control = "VCF Cutoff to 5.0", result = "Reveals the movement of the pulse width; brighter and less polite." },
]
[patch.params]
DcoRange = 1
DcoWaveSaw = 0
DcoWavePulse = 3
DcoPwmDepth = 0.38
DcoPwmRate = 0.28
DcoWaveSub = 0
DcoSubLevel = 1.4
NumberOfVoices = 0
VcfCutoff = 0.37
VcfResonance = 0.05
VcfEnvMod = 0.15
VcfKeyFollow = 0.3
VcaEnvMode = 0
EnvAttackTime = 0.12
EnvDecayTime = 0.55
EnvSustainLevel = 0.75
EnvReleaseTime = 0.34
DcoChorusSwitch = 1
ChorusRate = 0.3
ModWheelVcfRange = 0.35
ModWheelDcoLfo = 0
[patch.why]
DcoWavePulse = "A PWM pulse: its harmonic balance shifts slowly over time, giving movement without any added effect."
DcoPwmRate = "Slow, so the motion is felt rather than heard."
DcoChorusSwitch = "The chorus provides much of the 'velvet'; it's also the cause of the low-end width."
VcfCutoff = "Low enough that the top end stays soft, even with PWM moving."
EnvAttackTime = "A tiny attack softens the front of each note."
EnvReleaseTime = "A slight tail so notes overlap gently at slow tempos."
VcaEnvMode = "Normal, unlike the rolling patches: the amp shares the soft envelope, so each note has a gentle swell and decay."
