range = "E2 to E3"
expect = { centroid_hz = [150, 700], low_side_mid_max = 0.02 }
performance = "Designed for root-octave-root patterns: the detuned upper layer gives each high note extra shimmer."
use = "The classic octave-jump disco and outrun bassline. Also solid on pumping 16ths in the highest-energy section."
mix = [
  "Plenty of mid content, so it can be mixed lower than you'd expect.",
  "If it clashes with lead or guitar, dip 1-2 kHz by 2 dB rather than filtering the bass.",
  "Slow beating from the detune is a feature; don't over-compress it.",
  "Mono, so no low-end width problems.",
]
pairings = [
  { with = "Hero Theme", why = "The octave motion gives a held lead rhythmic support." },
  { with = "Sunrise Fanfare", why = "Brass stabs land between octave jumps in a classic disco arrangement." },
  { with = "Four-on-the-floor kick", external = true, why = "Off-beat high notes fill the gaps between kicks." },
]
tweaks = [
  { control = "Pulse TUNE to +7", result = "A fifth above instead of an octave: darker, power-chord feel, but careful with minor keys." },
  { control = "Pulse fine tune to 0", result = "Stops the beating for a cleaner, more static tone." },
  { control = "Pulse VOLUME to 3.0", result = "Pulls the metal back; closer to a plain saw bass." },
]
[patch.params]
DcoRange = 2
DcoWaveSaw = 1
DcoWavePulse = 1
specialPulseTune = 12
specialPulseFineTune = 0.07
specialPulseVolume = 0.6
DcoSubLevel = 0
NumberOfVoices = 0
VcfCutoff = 0.32
VcfResonance = 0.22
VcfEnvMod = 0.42
VcfKeyFollow = 0.35
VcaEnvMode = 1
EnvDecayTime = 0.34
EnvSustainLevel = 0.2
EnvReleaseTime = 0.08
ModWheelVcfRange = 0.4
ModWheelDcoLfo = 0
[patch.why]
DcoWavePulse = "The second sound source; it can be retuned separately from the saw, a TAL addition to the original hardware."
specialPulseTune = "An octave up, so the pulse adds presence while the saw holds the fundamental."
specialPulseFineTune = "About 7 cents sharp: slow beating that reads as metallic shine rather than out-of-tune."
specialPulseVolume = "Below the saw so the bass stays the main identity."
VcfCutoff = "About 120 Hz at rest, opening on each note."
EnvDecayTime = "Short enough that fast octave jumps stay separate."
VcaEnvMode = "Gate: the amp holds, so jumps stay connected even as the filter closes."

[[patch]]
name = "Midnight Sub"
tags = ["dreamwave", "chillwave", "outrun"]
browser = "Near-sine sub foundation | Vel: none | MW: none"
profile = "A near-sine foundation with no bite: pure low end for layering or ballads."
phrase = "sustained"
range = "E2 to E3"
expect = { centroid_hz = [40, 140], low_side_mid_max = 0.02, attack_s = [0.002, 0.08] }
performance = "Play long notes. There's no filter sweep or velocity response, by design."
use = "Under another bass as a dedicated sub layer, or alone on ballads. Doubling a bright bass with this lets you high-pass the bright part freely."
mix = [
  "Almost entirely below 150 Hz: check it on a system or headphones that reproduce that range.",
  "Add saturation on a copy if it must translate to small speakers.",
  "Sidechain to the kick, since both live in the same band.",
  "When layering, high-pass the other bass around 120 Hz and keep this mono.",
]
pairings = [
  { with = "Chrome Octave", why = "A classic layer: high-pass Chrome Octave around 120 Hz and let this carry the sub." },
  { with = "Steel Engine", why = "Adds a solid mono centre under the wide unison." },
  { with = "Velvet Bass", why = "A soft, deep pair for slow dreamwave passages." },
  { with = "Felt piano and soft vocals", external = true, why = "A plain low end stays out of the way of a delicate ballad arrangement." },
]
tweaks = [
  { control = "VCF Cutoff to 5.0", result = "Lets the square's third harmonic through, so it's audible on small speakers." },
  { control = "ENV T1 (attack) to 0", result = "Harder start with a slight click; can help definition." },
  { control = "PORTAMENTO to ON, time 2", result = "Smooth slides between overlapping notes, for 808-style movement." },
]
[patch.params]
DcoRange = 2
DcoWaveSaw = 0
DcoWavePulse = 1
DcoSubLevel = 0
NumberOfVoices = 0
VcfCutoff = 0.385
VcfResonance = 0
VcfKeyFollow = 1
VcaEnvMode = 0
EnvAttackTime = 0.15
EnvDecayTime = 0
EnvSustainLevel = 1
EnvReleaseTime = 0.25
ModWheelDcoLfo = 0
[patch.why]
DcoWavePulse = "A square has no 2nd harmonic and its 3rd is already 10 dB down, so it's the easiest wave to filter into a near-sine."
VcfCutoff = "About 190 Hz at C4; with full key follow the filter stays about 1.5x above the note wherever you play."
VcfKeyFollow = "Full tracking: a constant tone on every note. Without it the higher notes would sound dull and thin."
EnvAttackTime = "About 15 ms of attack removes the click a sine-like wave would otherwise make."
EnvReleaseTime = "A short tail prevents an abrupt stop that would read as a click."

[[patch]]
name = "Blacktop"
tags = ["darksynth", "outrun"]
browser = "Dark, throaty PWM bass | Vel: none | MW: open filter"
profile = "Dark, throaty bass with a slowly shifting tone and heavy low-mid weight: menacing without being harsh."
phrase = "rolling"
range = "E2 to A3"
expect = { centroid_hz = [100, 450], low_side_mid_max = 0.02 }
performance = "Plays evenly at any velocity, so the tension comes from the notes and the slow tonal shift. Hold longer notes to hear the movement. Mod wheel opens the filter from dark to growling."
use = "Brooding darksynth verses, slower outrun grooves and half-time sections. Works as a plain 8ths line or long, held root notes."
mix = [
  "The bass boost already adds about 6 dB up to 250 Hz, so don't add another low boost; cut around 200 Hz if it turns boomy.",
  "Sidechain to the kick; there's a lot of sustained low-mid energy between hits.",
  "Mono, so it's safe in the centre.",
  "For more aggression, add saturation after the synth rather than opening the filter.",
]
pairings = [
  { with = "Night Patrol", why = "Dark sustained brass over a brooding line is the core darksynth texture." },
  { with = "Black Horizon", why = "Both are dark, so keep the pad high-passed above the bass and let the slow movements overlap." },
  { with = "Deep analog toms", external = true, why = "Tom fills speak clearly over the steady low-mid weight." },
]
tweaks = [
  { control = "HPF to Off", result = "Removes the low boost: tighter, and easier to fit under a big kick." },
  { control = "PWM RATE to 6.0", result = "Faster movement that adds a nervous, agitated shimmer." },
  { control = "VCF Cutoff to 5.0", result = "Brings the growl forward for a chorus or drop." },
]
[patch.params]
DcoRange = 1
DcoWaveSaw = 3
DcoPwmDepth = 0.55
DcoPwmRate = 0.32
DcoWaveSub = 0
DcoSubLevel = 1.6
HpfCutoff = 0
NumberOfVoices = 0
VcfCutoff = 0.33
VcfResonance = 0.15
VcfEnvMod = 0.28
VcfKeyFollow = 0.3
VcaEnvMode = 1
EnvDecayTime = 0.42
EnvSustainLevel = 0.4
EnvReleaseTime = 0.1
ModWheelVcfRange = 0.35
ModWheelDcoLfo = 0
[patch.why]
DcoWaveSaw = "The Saw PW wave: unlike a plain saw, its harmonic balance shifts with the PWM, which gives the tone its throaty movement."
DcoPwmDepth = "Enough movement to hear the tone change, without turning into an obvious wobble."
DcoPwmRate = "Slow, so the shift unfolds across several notes: more unease than effect."
DcoRange = "8' with the sub an octave down: the sub carries the fundamental and the moving saw sits above it."
DcoSubLevel = "A solid square underneath that stays steady while the saw moves."
HpfCutoff = "The shelving bass boost lifts everything up to about 250 Hz by about 6 dB. This is the source of the heavy low-mid weight."
VcfCutoff = "Dark, keeping the upper harmonics tucked away."
VcfEnvMod = "A small sweep: a slight bark at the start of each note, with no bright pluck."
VcaEnvMode = "Gate: the amp holds while the filter settles, so notes keep their weight."

[[patch]]
name = "Turbo Glide"
tags = ["outrun", "dreamwave"]
browser = "Mono glide bass | Vel: none | MW: open filter | Bend 7 st"
