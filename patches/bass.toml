performance = "Overlap notes to slide; lift between notes for no slide. Slides are therefore a playing choice in each MIDI part. Pitch bend reaches a fifth."
use = "Expressive fills and turnarounds, or a melodic bass answering the lead. Slide into the downbeat of a new section."
mix = [
  "Listen to slides against the kick: pitch movement can make sidechain feel uneven.",
  "Compress lightly; glides change perceived loudness.",
  "Keep other parts out of the low mids during long slides.",
  "Mono, so it's safe in the centre.",
]
pairings = [
  { with = "Portamento Dream", why = "The bass and lead can slide together for a floating section." },
  { with = "Analog Dusk", why = "A static pad makes the movement stand out." },
  { with = "Fretless-style bass DI", external = true, why = "Double for a hybrid organic and synthetic line." },
]
tweaks = [
  { control = "PORTAMENTO mode to ALL", result = "Every note glides, including detached ones: more drunken and dramatic." },
  { control = "Portamento TIME to 4", result = "Slower slides, for half-time and intros." },
  { control = "VCF RES to 4.5", result = "A vocal 'wah' on each slide." },
]
[patch.params]
DcoRange = 2
DcoWaveSaw = 1
DcoSubLevel = 0
NumberOfVoices = 0
PortamentoMode = 1
PortamentoTime = 0.26
BenderRange = 7
VcfCutoff = 0.3
VcfResonance = 0.25
VcfEnvMod = 0.32
VcfKeyFollow = 0.6
VcaEnvMode = 0
EnvDecayTime = 0.5
EnvSustainLevel = 0.45
EnvReleaseTime = 0.15
ModWheelVcfRange = 0.4
ModWheelDcoLfo = 0
[patch.why]
PortamentoMode = "ON glides only between overlapping notes, so each part decides where slides happen. Measured: detached notes jump straight to pitch."
PortamentoTime = "About 70 ms per octave: an audible slide that still lands within an 8th note at synthwave tempos."
NumberOfVoices = "Mono is what makes legato gliding work properly."
VcfKeyFollow = "Follows the pitch partially, so a note keeps its brightness as it slides."
EnvDecayTime = "A slower close than the rolling patches: sustained notes stay expressive."
BenderRange = "A fifth up or down for dramatic manual bends."

[[patch]]
