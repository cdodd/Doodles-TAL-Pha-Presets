# Bass patches. Parameters use the names and units stored in .talalpha files.
# Anything not listed stays at the plugin's init value. Volume is set by the build
# (loudness normalisation), so it is not listed here.

category = "Bass"
mix_defaults = [
  "High-pass around 30 Hz; below that there's little but rumble.",
  "Lift 800 Hz to 1.5 kHz a little for small speakers, and leave the lows alone.",
  "Sidechain to the kick with a fast attack and about 100 ms release, for 3-6 dB of reduction.",
  "Keep it centred. Narrow anything wide below about 120 Hz.",
  "Keep reverb and delay off the low end: filter the send, or use none.",
]

[[patch]]
name = "Nightdrive"
tags = ["outrun", "darksynth"]
browser = "Rolling filter bass | Vel: brightness | MW: open filter"
profile = "Tight, rolling filter bass that drives a track without covering the kick."
phrase = "rolling"
range = "E2 to A3 (sounds an octave lower, 16')"
expect = { centroid_hz = [120, 500], low_side_mid_max = 0.02, sweep_octaves = [0.5, 6] }
performance = "Velocity sets the filter sweep: accent the on-beats for the classic pumping groove. Mod wheel opens the filter for a brighter chorus section."
use = "Straight 8ths or 16ths under verse and chorus: the default engine of an outrun track. Program velocity accents rather than playing all notes equal."
mix = [
  "High-pass at 30 Hz; little useful energy sits below the 16' fundamental.",
  "Sidechain to the kick with a fast release (around 80-120 ms) so the pump sits with the 8ths.",
  "Keep it dead centre; it is already mono.",
  "A small 800 Hz to 1.5 kHz lift brings it through on small speakers; don't touch the lows.",
]
pairings = [
  { with = "Outrun Sixteenths", why = "Bass plays 8ths, arp plays 16ths an octave or two up, so the rhythm interlocks without masking." },
  { with = "Endless Highway", why = "Slow PWM pad fills the mids above the short bass notes." },
  { with = "Gated snare and LinnDrum-style kit", external = true, why = "The short decay leaves room for a big snare tail." },
]
tweaks = [
  { control = "VCF Cutoff to 4.0", result = "Brighter, more aggressive; useful for a final chorus." },
  { control = "VCF ENV mode to Normal", result = "Removes velocity response; every note is equally bright and mechanical." },
  { control = "ENV T3 (decay) to 4.5", result = "Each note stays open longer, turning the rolling feel into a longer growl." },
]
[patch.params]
DcoRange = 2
DcoWaveSaw = 1
DcoSubLevel = 0
NumberOfVoices = 0
VcfCutoff = 0.27
VcfResonance = 0.2
VcfEnvMode = 2
VcfEnvMod = 0.52
VcfKeyFollow = 0.3
VcaEnvMode = 1
EnvDecayTime = 0.36
EnvSustainLevel = 0.15
EnvReleaseTime = 0.08
EnvKeyFollow = 0.2
ModWheelVcfRange = 0.45
ModWheelDcoLfo = 0
[patch.why]
DcoRange = "16' saw: strong fundamental around 55 Hz for typical bass notes, plus harmonics that survive small speakers."
DcoWaveSaw = "The plain saw has the even harmonic series a filter sweep needs."
VcfCutoff = "Starts dark, so the envelope does the talking and notes don't crowd the kick's click."
VcfResonance = "Just enough to give the sweep an edge without thinning the low end."
VcfEnvMode = "Normal-Dynamic: harder notes open the filter more. This is the source of the groove."
VcfEnvMod = "Big enough that accents sweep well above the resting cutoff, while soft notes barely open."
EnvDecayTime = "A fast close around 200 ms sets the rhythmic 'pluck' of each 8th."
VcaEnvMode = "Gate holds the amp open while the shared envelope closes the filter, so the note keeps its weight after the pluck."
NumberOfVoices = "Mono, so notes never smear the low end."

[[patch]]
name = "Neon Pulse"
tags = ["outrun", "dreamwave"]
browser = "Round square + sub | Vel: none | MW: open filter"
profile = "Round, hollow square-and-sub bass that stays out of the way of busy arps."
phrase = "rolling"
range = "E2 to A3"
expect = { centroid_hz = [80, 350], low_side_mid_max = 0.02 }
performance = "Even and steady on purpose: no velocity response. Mod wheel opens the filter."
use = "Under dense arrangements where a saw bass would fight the arp and pads. Good for simple root-note lines."
mix = [
  "Almost no compression needed; the level is very even.",
  "The ALT boost already adds weight at 80 Hz, so don't stack another low boost on it.",
  "Sidechain lightly: the sustained body makes a heavy duck obvious.",
  "Add gentle saturation if it vanishes on phone speakers.",
]
pairings = [
  { with = "Crystal Steps", why = "A high, busy arp has the whole spectrum above this simple bass to itself." },
  { with = "Hero Theme", why = "A wide lead needs a steady, uncomplicated foundation." },
  { with = "Clean chorus electric guitar", external = true, why = "Hollow square leaves the guitar's low mids free." },
]
tweaks = [
  { control = "SUB OSC level to 2.5", result = "More weight at the sub-octave; check on a big system for boom." },
  { control = "PULSE to 25%", result = "Nasal and more present; even harmonics return, so it's less hollow." },
  { control = "VCF Cutoff to 5.0", result = "Reveals the square's odd harmonics for a gamey, 8-bit edge." },
]
[patch.params]
DcoRange = 1
DcoWaveSaw = 0
DcoWavePulse = 1
DcoWaveSub = 0
DcoSubLevel = 1.5
NumberOfVoices = 0
HpfCutoff = 0
resonanceBoostFrequency = 1
VcfCutoff = 0.36
VcfResonance = 0.08
VcfEnvMod = 0.22
VcfKeyFollow = 0.25
VcaEnvMode = 1
EnvDecayTime = 0.42
EnvSustainLevel = 0.45
EnvReleaseTime = 0.1
ModWheelVcfRange = 0.4
ModWheelDcoLfo = 0
[patch.why]
DcoRange = "8' with the sub an octave down: the sub carries the fundamental and the square adds definition an octave up."
DcoWavePulse = "A square has only odd harmonics, which gives the hollow character and leaves gaps for other parts."
DcoWaveSub = "The panel labels this position OFF, but it is a square one octave down. Only level 0 silences the sub."
DcoSubLevel = "About the same weight as the square, so the two fuse into one note."
HpfCutoff = "Bass boost with ALT: a +6 dB peak at 80 Hz rather than the boomier shelf."
VcfCutoff = "About 160 Hz: warm and rounded, with the third harmonic audible but soft."
VcfEnvMod = "Only a small sweep, so the note has a soft front without a bright pluck."
EnvSustainLevel = "Moderate sustain keeps a steady tone rather than a decaying one."

[[patch]]
