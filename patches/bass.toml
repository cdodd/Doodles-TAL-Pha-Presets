  "Essential: collapse below about 120 Hz to mono in the mix. This patch has some low-end width from unison.",
  "Or high-pass at 120 Hz and put Midnight Sub underneath.",
  "Sidechain hard; it's a constant wall of energy.",
  "Check mono compatibility: unison can thin out when summed.",
]
pairings = [
  { with = "Midnight Sub", why = "Solid mono sub under the wide wall." },
  { with = "Power Brass", why = "Together they're the wall of a darksynth drop." },
  { with = "Big gated snare", external = true, why = "Needs a large snare to punch through this much sustain." },
]
tweaks = [
  { control = "UNISON spread to 0", result = "All voices centred: fully mono-safe, and more of a focused buzz." },
  { control = "UNISON detune to 0.30", result = "Wider beating, more dissonant and aggressive." },
  { control = "VCF Cutoff to 6.0", result = "Opens right up to a raw, abrasive roar." },
]
[patch.params]
DcoRange = 2
DcoWaveSaw = 1
DcoSubLevel = 0
NumberOfVoices = 0
UnisonoVoices = 0.25
UnisonoDetune = 0.12
UnisonoSpread = 0.25
VcfCutoff = 0.42
VcfResonance = 0.1
VcfEnvMod = 0.3
VcfKeyFollow = 0.3
VcaEnvMode = 1
EnvDecayTime = 0.45
EnvSustainLevel = 0.55
EnvReleaseTime = 0.1
eqBellFreq = 0.42
eqBellQ = 0.4
eqBellGain = 2.5
ModWheelVcfRange = 0.3
ModWheelDcoLfo = 0
[patch.why]
UnisonoVoices = "4 stacked voices give thickness a single DCO can't."
UnisonoDetune = "Small: engine-like beating rather than a chorus of separate pitches. Too much loses the sense of a bass note."
UnisonoSpread = "Deliberately narrow; full spread measured almost as much side as mid, even below 150 Hz."
VcfCutoff = "Open enough to hear the beating in the harmonics."
EnvSustainLevel = "High sustain keeps the engine running between attacks."
eqBellGain = "A mid lift helps it read as aggression rather than mud."

