DcoWaveSaw = 1
Noise = 2
DcoSubLevel = 0
NumberOfVoices = 3
VcfCutoff = 0.22
VcfResonance = 0.35
VcfEnvMod = 0.68
EnvAttackTime = 0.78
EnvDecayTime = 0.5
EnvSustainLevel = 1
EnvReleaseTime = 0.35
