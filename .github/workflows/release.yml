name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build zip
        run: cd presets && zip -r ../Doodles-TAL-Pha-Presets.zip Doodles
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Doodles-TAL-Pha-Presets.zip --generate-notes
